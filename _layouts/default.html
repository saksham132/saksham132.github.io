<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site"><div class="wrap">
    {% unless page.home %}<a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>{% endunless %}
    <nav>
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.nav == item.title %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div></header>
  <main><div class="wrap">
    {{ content }}
  </div></main>
  {% include footer.html %}
</body>
</html>
